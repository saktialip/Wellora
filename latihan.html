<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex</title>
    <style>
        .container-1 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
                .container-2 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: start;
            align-items: center;
        }
                .container-3 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: end;
            align-items: center;
        }
                        .container-4 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
                        .container-5 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container-6 {
            width: 800px;
            height: 300px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .container-7 {
            width: 800px;
            height: 400px;
            border: 2px solid black;
            margin: auto;
            padding: 10px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .item {
            background-color: navy;
            color:white;
            width: 150px;
            height: 150px;
            border-radius: 25px;
            display: flex;
            justify-content:center;
            align-items: center;
        }
        h3 {
            text-align: center;
        }
    </style>
</head>
<body>
    <h3>justify-content: center</h3>
    <div class="container-1">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>justify-content: start</h3>
        <div class="container-2">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
    <h3>justify-content: end</h3>
        <div class="container-3">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
    </div>
        <h3>justify-content: space-around</h3>
        <div class="container-4">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        </div>
            <h3>justify-content: space-between</h3>
        <div class="container-5">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        </div>
            <h3>justify-content: space-evenly</h3>
        <div class="container-6">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        </div>
<h3>Flex Wrap</h3>
        <div class="container-7">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
        </div>
</body>
</html>
